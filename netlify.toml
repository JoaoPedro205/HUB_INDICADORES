[build]
  publish = "public"
  functions = "netlify/functions"

# O Hub sempre revalida: ao publicar uma nova versão, todos recebem a atualização.
[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-store"
